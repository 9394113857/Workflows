
name: 🚀 Flask-Website Trigger 👉🏻 Daily Render Flask Website Wake Up

on:
  schedule:
    # Every day at 6:00 AM IST (00:30 UTC)
    - cron: "30 0 * * *"

  workflow_dispatch:

jobs:
  wake-website:
    name: Wake Up Render Website
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # STEP 1: WAKE UP WEBSITE
      # ==========================================

      - name: Trigger Website And Capture Response
        id: wakeup
        continue-on-error: true

        env:
          WEBSITE_URL: ${{ secrets.APPLICATION_HEALTH_URL }}

        run: |
          echo "========================================"
          echo "RENDER WEBSITE WAKE-UP"
          echo "========================================"

          echo "Website: $WEBSITE_URL"
          echo "Schedule: Daily at 6:00 AM IST"

          echo "Sending one HTTP GET request..."

          if [ -z "$WEBSITE_URL" ]; then
            echo "Website URL secret is missing."
            exit 1
          fi

          RESPONSE_FILE="$RUNNER_TEMP/website-response.txt"
          ERROR_FILE="$RUNNER_TEMP/curl-error.txt"

          set +e

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 900 \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "$WEBSITE_URL" \
            2>"$ERROR_FILE")

          CURL_EXIT=$?

          set -e

          RESPONSE=$(cat "$RESPONSE_FILE" 2>/dev/null || true)
          CURL_ERROR=$(cat "$ERROR_FILE" 2>/dev/null || true)

          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_STATUS" = "200" ]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi

          echo ""
          echo "========================================"
          echo "HTTP REQUEST RESULT"
          echo "========================================"

          echo "HTTP Status: $HTTP_STATUS"
          echo "Curl Exit Code: $CURL_EXIT"
          echo "Result: $STATUS"

          {
            echo "RESPONSE_STATUS=$STATUS"
            echo "HTTP_STATUS=$HTTP_STATUS"
            echo "CURL_EXIT=$CURL_EXIT"

            echo "RESPONSE<<EOF"
            printf '%s\n' "$RESPONSE"
            echo "EOF"

            echo "CURL_ERROR<<EOF"
            printf '%s\n' "$CURL_ERROR"
            echo "EOF"

          } >> "$GITHUB_ENV"

          echo ""
          echo "Website request completed."

      # ==========================================
      # STEP 2: DISPLAY ACTUAL WEBSITE RESPONSE
      # ==========================================

      - name: Display Website Response

        if: always()

        run: |
          echo "========================================"
          echo "ACTUAL WEBSITE RESPONSE"
          echo "========================================"

          echo "HTTP Status: ${{ env.HTTP_STATUS }}"
          echo "Curl Exit Code: ${{ env.CURL_EXIT }}"

          echo ""
          echo "Response Body:"
          echo "${{ env.RESPONSE }}"

          echo ""
          echo "Curl Error:"
          echo "${{ env.CURL_ERROR }}"

          echo "========================================"

      # ==========================================
      # STEP 3: FINAL WORKFLOW SUMMARY
      # ==========================================

      - name: Display Final Status

        if: always()

        run: |
          echo "========================================"
          echo "RENDER WEBSITE WAKE-UP COMPLETED"
          echo "========================================"

          echo "Website: ${{ secrets.APPLICATION_HEALTH_URL }}"
          echo "Scheduled Time: 6:00 AM IST"
          echo "Trigger Type: ${{ github.event_name }}"
          echo "Workflow Run: ${{ github.run_number }}"

          echo "HTTP Status: ${{ env.HTTP_STATUS }}"
          echo "Curl Exit Code: ${{ env.CURL_EXIT }}"
          echo "Final Result: ${{ env.RESPONSE_STATUS }}"

          echo "========================================"
